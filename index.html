<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panchawati Order Rail (Lite)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-in {
        animation: slideIn 0.3s ease-out forwards;
      }
      .card-new {
        border-left: 4px solid #f97316; /* orange-500 */
      }
      .card-ready {
        border-left: 4px solid #22c55e; /* green-500 */
      }
      .card-completed {
        border-left: 4px solid #64748b; /* slate-500 */
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans h-screen flex flex-col overflow-hidden">
    <!-- Header Removed as per request -->
    <header
      class="bg-white border-b border-slate-200 px-4 py-3 md:px-6 md:py-4 flex flex-col md:flex-row justify-between items-center shadow-sm z-10 gap-3 md:gap-0"
    >
      <div
        class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start"
      >
        <div class="flex items-center gap-4">
          <div
            class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-orange-200"
          >
            <i class="fa-solid fa-utensils"></i>
          </div>
          <div>
            <h1 class="text-lg md:text-xl font-bold text-slate-900">
              Kitchen Display
            </h1>
            <p class="text-xs text-slate-500 flex items-center gap-2">
              <span
                class="w-2 h-2 rounded-full bg-green-500"
                id="socket-status"
              ></span>
              <span id="connection-text">Connecting...</span>
            </p>
          </div>
        </div>

        <!-- Mobile Logout -->
        <button
          id="logout-btn-mobile"
          class="md:hidden bg-slate-100 text-slate-600 p-2 rounded-lg"
        >
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>

      <div
        class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-500"
      >
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-orange-500"></span>
          <span
            >To Cook:
            <span id="count-to-cook" class="text-slate-900 font-bold"
              >0</span
            ></span
          >
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-green-500"></span>
          <span
            >Ready:
            <span id="count-ready" class="text-slate-900 font-bold"
              >0</span
            ></span
          >
        </div>
        <div class="text-slate-900 font-bold text-lg" id="clock">00:00</div>
        <button
          id="logout-btn"
          class="bg-slate-100 text-slate-600 hover:bg-red-50 hover:text-red-600 p-2 rounded-lg transition-colors"
          title="Sign Out"
        >
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>
    <!-- Main Rail -->
    <main class="flex-1 overflow-hidden relative bg-slate-50">
      <!-- Floating Logout & Status -->

      <div class="flex flex-col h-full w-full p-4 md:p-6">
        <!-- Column: Kitchen Orders -->
        <div
          id="col-cook"
          class="flex-1 flex flex-col w-full bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden h-full"
        >
          <div
            class="p-4 bg-white border-b border-slate-200 flex justify-between items-center sticky top-0 z-10"
          >
            <h2
              class="font-bold text-slate-800 flex items-center gap-2 text-lg"
            >
              <i class="fa-solid fa-fire text-orange-500"></i> Kitchen Orders
            </h2>
            <span
              class="bg-orange-100 text-orange-700 text-sm font-bold px-3 py-1 rounded-lg"
              id="badge-to-cook"
              >0</span
            >
          </div>
          <div
            class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide"
            id="rail-to-cook"
          >
            <!-- Orders will be injected here -->
          </div>
        </div>

        <!-- Hidden Columns (Preserved for JS compatibility but hidden) -->
        <div id="col-ready" class="hidden"></div>
        <div id="col-completed" class="hidden"></div>
        <div id="rail-ready" class="hidden"></div>
        <div id="rail-completed" class="hidden"></div>

        <!-- Hidden Counters (Preserved for JS compatibility) -->
        <span id="count-to-cook" class="hidden"></span>
        <span id="count-ready" class="hidden"></span>
        <span id="badge-ready" class="hidden"></span>
        <span id="badge-completed" class="hidden"></span>
        <span id="connection-text" class="hidden"></span>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
