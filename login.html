<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Panchawati Rail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 font-sans h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-6">
      <div
        class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden"
      >
        <div class="p-8">
          <div class="text-center mb-8">
            <div
              class="w-16 h-16 bg-orange-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-orange-200 mx-auto mb-4"
            >
              <i class="fa-solid fa-utensils"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Kitchen Display</h1>
            <p class="text-slate-500 mt-1">Please sign in to continue</p>
          </div>

          <form id="login-form" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1"
                >Email Address</label
              >
              <div class="relative">
                <i
                  class="fa-solid fa-envelope text-slate-400 absolute left-4 top-1/2 -translate-y-1/2"
                ></i>
                <input
                  type="email"
                  id="email"
                  class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1"
                >Password</label
              >
              <div class="relative">
                <i
                  class="fa-solid fa-lock text-slate-400 absolute left-4 top-1/2 -translate-y-1/2"
                ></i>
                <input
                  type="password"
                  id="password"
                  class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 outline-none transition-all"
                  placeholder="Enter your password"
                  required
                />
              </div>
            </div>

            <div
              id="error-message"
              class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg text-center"
            >
              Invalid credentials
            </div>

            <button
              type="submit"
              id="login-btn"
              class="w-full bg-orange-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-200 hover:bg-orange-600 active:scale-95 transition-all flex items-center justify-center gap-2"
            >
              <span>Sign In</span>
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </form>
        </div>
        <div
          class="bg-slate-50 p-4 text-center text-xs text-slate-400 border-t border-slate-100"
        >
          Panchawati Cafe &copy; 2025
        </div>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
